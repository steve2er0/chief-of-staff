<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lunar Base · Agents</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/lunar-base/workspace.css"><script src="/agent-model.js" defer></script><script src="/lunar-base/simulation.js" defer></script><script src="/lunar-base/scene.js" defer></script><script src="/app.js" defer></script><script src="/reference-files.js" defer></script><script src="/path-picker.js" defer></script><script src="/conversation-feedback.js" defer></script><script src="/task-feedback.js" defer></script><script src="/workspace.js" defer></script><script src="/attention.js" defer></script><script src="/agents.js" defer></script></head>
<body data-agent-workspace="true">
<main class="agent-workspace"><header class="workspace-header"><a class="brand" href="#live"><span class="brand-mark">CoS</span><span>Lunar Base</span></a><nav class="workspace-actions" aria-label="Workspace controls"><button disabled data-view="review">Needs you <span id="attention-count"></span></button><button disabled data-view="results">Results <span id="result-count"></span></button><button disabled data-view="projects">Projects</button><button disabled data-view="settings" aria-label="Workspace settings">Settings</button><button disabled data-start-agent class="primary">+ Start agents</button></nav></header>
